name: Release

on:
  workflow_call:
    inputs:
      tooling-ref:
        description: The same workflows repository tag or commit SHA used in the caller's uses reference.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out calling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          path: project
          persist-credentials: false

      - name: Check out release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: le0u0/workflows
          ref: ${{ inputs.tooling-ref }}
          path: release-tooling
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install release tooling
        working-directory: release-tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Release calling repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node release-tooling/release.mjs "$GITHUB_WORKSPACE/project"
